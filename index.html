<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Key System - Admin Panel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 48px;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            padding: 25px;
        }

        .stat-card h3 {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 10px;
        }

        .stat-card .number {
            font-size: 36px;
            font-weight: bold;
        }

        .green { color: #00ff88; }
        .blue { color: #6496ff; }
        .purple { color: #a78bfa; }

        .section {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
        }

        .section h2 {
            margin-bottom: 20px;
            font-size: 28px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: rgba(255, 255, 255, 0.8);
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            color: white;
            font-size: 16px;
        }

        .btn {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .btn:hover {
            transform: scale(1.05);
        }

        .btn-success {
            background: linear-gradient(45deg, #00ff88, #00cc66);
        }

        .result-box {
            margin-top: 20px;
            padding: 20px;
            border-radius: 10px;
            display: none;
        }

        .result-box.show {
            display: block;
        }

        .result-box.success {
            background: rgba(0, 255, 100, 0.1);
            border: 2px solid rgba(0, 255, 100, 0.5);
        }

        .result-box.error {
            background: rgba(255, 100, 100, 0.1);
            border: 2px solid rgba(255, 100, 100, 0.5);
        }

        .key-code {
            font-family: 'Courier New', monospace;
            font-size: 24px;
            color: #00ff88;
            margin: 10px 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .copy-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            color: white;
        }

        .keys-table {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .status-badge {
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .status-available {
            background: rgba(0, 255, 100, 0.2);
            color: #00ff88;
        }

        .status-redeemed {
            background: rgba(100, 150, 255, 0.2);
            color: #6496ff;
        }

        .action-btn {
            padding: 5px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            margin: 0 2px;
            border: none;
            color: white;
            background: rgba(255, 100, 100, 0.3);
        }

        .action-btn:hover {
            background: rgba(255, 100, 100, 0.5);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔐 Key System - Admin Panel</h1>
            <p>Generate, check, and manage keys</p>
        </div>

        <div class="stats">
            <div class="stat-card">
                <h3>Total Keys</h3>
                <div class="number purple" id="totalKeys">0</div>
            </div>
            <div class="stat-card">
                <h3>Active Keys</h3>
                <div class="number green" id="activeKeys">0</div>
            </div>
            <div class="stat-card">
                <h3>Redeemed Keys</h3>
                <div class="number blue" id="redeemedKeys">0</div>
            </div>
        </div>

        <!-- Check Key Section -->
        <div class="section">
            <h2>🔍 Check Key Validity</h2>
            <div class="input-group">
                <label>Enter Key to Check</label>
                <input type="text" id="checkKeyInput" placeholder="XXXX-XXXX-XXXX-XXXX" style="text-transform: uppercase;">
            </div>
            <button class="btn btn-success" onclick="checkKey()">Check Key</button>
            
            <div class="result-box" id="checkResult"></div>
        </div>

        <!-- Generate Key Section -->
        <div class="section">
            <h2>🔑 Generate New Key</h2>
            <button class="btn" onclick="generateKey()">Generate Key</button>
            
            <div class="result-box success" id="genResult"></div>
        </div>

        <!-- All Keys Table -->
        <div class="section">
            <h2>📊 All Keys</h2>
            <div class="keys-table">
                <table>
                    <thead>
                        <tr>
                            <th>Key</th>
                            <th>Status</th>
                            <th>HWID</th>
                            <th>Roblox User</th>
                            <th>Created</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="keysTable">
                        <tr>
                            <td colspan="6" style="text-align: center; padding: 40px;">
                                Loading keys...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // Storage functions using window.storage
        async function loadKeys() {
            try {
                const result = await window.storage.get('all_keys');
                return result ? JSON.parse(result.value) : {};
            } catch (error) {
                console.error('Error loading keys:', error);
                return {};
            }
        }

        async function saveKeys(keys) {
            try {
                await window.storage.set('all_keys', JSON.stringify(keys));
                console.log('✅ Keys saved successfully!');
                return true;
            } catch (error) {
                console.error('❌ Error saving keys:', error);
                alert('Error saving keys: ' + error.message);
                return false;
            }
        }

        // Generate random key
        function generateKeyString() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            const segments = [];
            for (let i = 0; i < 4; i++) {
                let segment = '';
                for (let j = 0; j < 4; j++) {
                    segment += chars[Math.floor(Math.random() * chars.length)];
                }
                segments.push(segment);
            }
            return segments.join('-');
        }

        // Generate new key
        async function generateKey() {
            try {
                const keys = await loadKeys();
                const key = generateKeyString();
                
                keys[key] = {
                    hwid: null,
                    robloxUsername: null,
                    robloxId: null,
                    createdAt: Date.now(),
                    redeemedAt: null,
                    valid: true
                };

                const saved = await saveKeys(keys);
                
                if (saved) {
                    const resultBox = document.getElementById('genResult');
                    resultBox.innerHTML = `
                        <p style="color: #00ff88; font-weight: bold; font-size: 18px;">✨ Key Generated Successfully!</p>
                        <div class="key-code">
                            <span id="generatedKey">${key}</span>
                            <button class="copy-btn" onclick="copyKey('${key}')">📋 Copy</button>
                        </div>
                        <p style="color: rgba(255,255,255,0.7); margin-top: 10px;">
                            ✅ Key saved and ready to use!<br>
                            ✅ Give this key to users<br>
                            ✅ They can redeem it in Discord
                        </p>
                    `;
                    resultBox.classList.add('show');
                    await displayKeys();
                }
            } catch (error) {
                console.error('Error generating key:', error);
                alert('Error generating key: ' + error.message);
            }
        }

        // Check if key is valid
        async function checkKey() {
            const keyInput = document.getElementById('checkKeyInput').value.toUpperCase().trim();
            const resultBox = document.getElementById('checkResult');
            
            if (!keyInput) {
                resultBox.innerHTML = '<p style="color: #ff6464; font-weight: bold;">❌ Please enter a key!</p>';
                resultBox.className = 'result-box error show';
                return;
            }

            const keys = await loadKeys();
            const keyData = keys[keyInput];

            if (!keyData) {
                resultBox.innerHTML = `
                    <p style="color: #ff6464; font-weight: bold; font-size: 18px;">❌ INVALID KEY</p>
                    <p style="color: rgba(255,255,255,0.8); margin-top: 10px;">
                        Key: <code>${keyInput}</code><br>
                        This key does not exist in the system.
                    </p>
                `;
                resultBox.className = 'result-box error show';
                return;
            }

            if (!keyData.valid) {
                resultBox.innerHTML = `
                    <p style="color: #ff6464; font-weight: bold; font-size: 18px;">❌ KEY INVALID</p>
                    <p style="color: rgba(255,255,255,0.8); margin-top: 10px;">
                        Key: <code>${keyInput}</code><br>
                        This key has been deactivated or banned.
                    </p>
                `;
                resultBox.className = 'result-box error show';
                return;
            }

            if (keyData.hwid) {
                resultBox.innerHTML = `
                    <p style="color: #00ff88; font-weight: bold; font-size: 18px;">✅ KEY VALID (REDEEMED)</p>
                    <p style="color: rgba(255,255,255,0.8); margin-top: 10px;">
                        Key: <code>${keyInput}</code><br>
                        Status: 🔒 Redeemed<br>
                        HWID: <code>${keyData.hwid.substring(0, 32)}...</code><br>
                        Roblox User: ${keyData.robloxUsername || 'Not set'}<br>
                        Created: ${new Date(keyData.createdAt).toLocaleString()}<br>
                        ${keyData.redeemedAt ? `Redeemed: ${new Date(keyData.redeemedAt).toLocaleString()}` : ''}
                    </p>
                `;
                resultBox.className = 'result-box success show';
            } else {
                resultBox.innerHTML = `
                    <p style="color: #00ff88; font-weight: bold; font-size: 18px;">✅ KEY VALID (NOT REDEEMED)</p>
                    <p style="color: rgba(255,255,255,0.8); margin-top: 10px;">
                        Key: <code>${keyInput}</code><br>
                        Status: 🟢 Available - Not redeemed yet<br>
                        Created: ${new Date(keyData.createdAt).toLocaleString()}<br><br>
                        ⚠️ This key needs to be redeemed in Discord first before using in Roblox!
                    </p>
                `;
                resultBox.className = 'result-box success show';
            }
        }

        // Copy key to clipboard
        function copyKey(key) {
            navigator.clipboard.writeText(key);
            alert('✅ Key copied to clipboard!');
        }

        // Delete key
        async function deleteKey(key) {
            if (!confirm('Delete key: ' + key + '?')) return;
            try {
                const keys = await loadKeys();
                delete keys[key];
                await saveKeys(keys);
                await displayKeys();
            } catch (error) {
                alert('Error deleting key: ' + error.message);
            }
        }

        // Display all keys in table
        async function displayKeys() {
            try {
                const keys = await loadKeys();
                const total = Object.keys(keys).length;
                const active = Object.values(keys).filter(k => !k.hwid && k.valid).length;
                const redeemed = Object.values(keys).filter(k => k.hwid).length;

                document.getElementById('totalKeys').textContent = total;
                document.getElementById('activeKeys').textContent = active;
                document.getElementById('redeemedKeys').textContent = redeemed;

                const tbody = document.getElementById('keysTable');
                if (total === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; padding: 40px;">No keys generated yet. Click "Generate Key"!</td></tr>';
                    return;
                }

                tbody.innerHTML = '';
                Object.entries(keys).reverse().forEach(([key, data]) => {
                    const row = document.createElement('tr');
                    const statusBadge = data.hwid 
                        ? '<span class="status-badge status-redeemed">🔒 Redeemed</span>'
                        : '<span class="status-badge status-available">🟢 Available</span>';

                    row.innerHTML = `
                        <td><code style="color: #a78bfa;">${key}</code></td>
                        <td>${statusBadge}</td>
                        <td><code style="font-size: 11px;">${data.hwid ? data.hwid.substring(0, 16) + '...' : '-'}</code></td>
                        <td>${data.robloxUsername || '-'}</td>
                        <td>${new Date(data.createdAt).toLocaleDateString()} ${new Date(data.createdAt).toLocaleTimeString()}</td>
                        <td><button class="action-btn" onclick="deleteKey('${key}')">Delete</button></td>
                    `;
                    tbody.appendChild(row);
                });
            } catch (error) {
                console.error('Error displaying keys:', error);
                document.getElementById('keysTable').innerHTML = 
                    '<tr><td colspan="6" style="text-align: center; padding: 40px; color: #ff6464;">Error loading keys</td></tr>';
            }
        }

        // Allow Enter key to check
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('checkKeyInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    checkKey();
                }
            });
            
            // Make input uppercase as you type
            document.getElementById('checkKeyInput').addEventListener('input', function(e) {
                e.target.value = e.target.value.toUpperCase();
            });
            
            // Initial load
            displayKeys();
        });

        // Auto-refresh every 10 seconds
        setInterval(displayKeys, 10000);
    </script>
</body>
</html>
