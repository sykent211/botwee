<script>
    let keys = {};
    let apiUrl = 'https://sykent211.github.io/botwee/';
    let isConnected = false;

    // Load keys on startup
    async function loadKeys() {
        try {
            const response = await fetch(`${apiUrl}/api/keys`);
            if (response.ok) {
                const data = await response.json();
                if (data.success && data.keys) {
                    keys = data.keys;
                    updateDisplay();
                    updateConnectionStatus(true);
                    return;
                }
            }
        } catch (error) {
            console.log('Could not load keys from server:', error);
        }
        updateConnectionStatus(false);
    }

    function updateConnectionStatus(connected) {
        isConnected = connected;
        const statusEl = document.getElementById('connectionStatus');
        if (connected) {
            statusEl.innerHTML = `
                <div class="connection-status connected">
                    <div class="connection-dot" style="background: #00ff88;"></div>
                    Connected
                </div>
            `;
        } else {
            statusEl.innerHTML = `
                <div class="connection-status disconnected">
                    <div class="connection-dot" style="background: #ff6464;"></div>
                    Disconnected
                </div>
            `;
        }
    }

    function generateKeyString() {
        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
        const segments = [];
        for (let i = 0; i < 4; i++) {
            let segment = '';
            for (let j = 0; j < 4; j++) {
                segment += chars[Math.floor(Math.random() * chars.length)];
            }
            segments.push(segment);
        }
        return segments.join('-');
    }

    async function generateKey() {
        apiUrl = document.getElementById('apiUrl').value;
        document.getElementById('displayApiUrl').textContent = apiUrl;

        const key = generateKeyString();
        
        // Create key data for API
        const keyData = {
            maxUses: 1,
            expiresAt: null,
            notes: 'Generated from web panel'
        };

        // Send to bot server
        try {
            const response = await fetch(`${apiUrl}/api/addkey`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    key: key, 
                    data: keyData 
                })
            });

            const result = await response.json();
            
            if (response.ok && result.success) {
                // Add to local keys object with proper structure
                keys[key] = {
                    hwid: null,
                    robloxId: null,
                    robloxUsername: null,
                    discordId: null,
                    discordUsername: null,
                    createdAt: new Date().toISOString(),
                    redeemedAt: null,
                    expiresAt: keyData.expiresAt,
                    maxUses: keyData.maxUses || 1,
                    uses: 0,
                    active: true,
                    banned: false,
                    notes: keyData.notes
                };
                
                document.getElementById('generatedKey').textContent = key;
                document.getElementById('keyDisplay').classList.add('show');
                updateDisplay();
                updateConnectionStatus(true);
                
                // Show success message
                showNotification('Key generated successfully!', 'success');
            } else {
                alert('❌ Failed to generate key: ' + (result.error || 'Unknown error'));
                updateConnectionStatus(false);
            }
        } catch (error) {
            alert('❌ Error: Could not connect to bot server at ' + apiUrl + '\n\nMake sure:\n1. Bot is running\n2. URL is correct\n3. No firewall blocking');
            updateConnectionStatus(false);
        }
    }

    function copyKey() {
        const key = document.getElementById('generatedKey').textContent;
        navigator.clipboard.writeText(key);
        const btn = document.getElementById('copyBtn');
        btn.textContent = '✅ Copied!';
        btn.classList.add('copied');
        setTimeout(() => {
            btn.textContent = '📋 Copy';
            btn.classList.remove('copied');
        }, 2000);
    }

    async function deleteKey(key) {
        if (confirm('⚠️ Are you sure you want to delete this key?\n\nKey: ' + key)) {
            try {
                // Send delete request to server (you'll need to add this endpoint to bot.js)
                const response = await fetch(`${apiUrl}/api/key/${key}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': 'YOUR_ADMIN_SECRET' // Add this for security
                    }
                });
                
                if (response.ok) {
                    delete keys[key];
                    updateDisplay();
                    showNotification('Key deleted successfully!', 'success');
                } else {
                    showNotification('Failed to delete key from server', 'error');
                }
            } catch (error) {
                // Fallback: just remove from local display
                delete keys[key];
                updateDisplay();
                showNotification('Key removed from display (not from server)', 'warning');
            }
        }
    }

    function banKey(key) {
        if (confirm('⚠️ Are you sure you want to ban this key?\n\nKey: ' + key)) {
            fetch(`${apiUrl}/api/ban`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    key: key,
                    reason: 'Banned from admin panel'
                })
            }).then(response => response.json())
              .then(data => {
                  if (data.success) {
                      keys[key].banned = true;
                      updateDisplay();
                      showNotification('Key banned successfully!', 'success');
                  } else {
                      showNotification('Failed to ban key: ' + data.error, 'error');
                  }
              })
              .catch(error => {
                  showNotification('Error banning key', 'error');
              });
        }
    }

    function unbanKey(key) {
        if (confirm('⚠️ Are you sure you want to unban this key?\n\nKey: ' + key)) {
            fetch(`${apiUrl}/api/unban`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ key: key })
            }).then(response => response.json())
              .then(data => {
                  if (data.success) {
                      keys[key].banned = false;
                      updateDisplay();
                      showNotification('Key unbanned successfully!', 'success');
                  } else {
                      showNotification('Failed to unban key: ' + data.error, 'error');
                  }
              })
              .catch(error => {
                  showNotification('Error unbanning key', 'error');
              });
        }
    }

    function resetKeyHWID(key) {
        if (confirm('⚠️ Are you sure you want to reset HWID for this key?\n\nKey: ' + key)) {
            fetch(`${apiUrl}/api/reset`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ key: key })
            }).then(response => response.json())
              .then(data => {
                  if (data.success) {
                      keys[key].hwid = null;
                      keys[key].discordId = null;
                      keys[key].discordUsername = null;
                      keys[key].robloxId = null;
                      keys[key].robloxUsername = null;
                      keys[key].redeemedAt = null;
                      keys[key].uses = 0;
                      updateDisplay();
                      showNotification('HWID reset successfully!', 'success');
                  } else {
                      showNotification('Failed to reset HWID: ' + data.error, 'error');
                  }
              })
              .catch(error => {
                  showNotification('Error resetting HWID', 'error');
              });
        }
    }

    function updateDisplay() {
        // Update stats
        const total = Object.keys(keys).length;
        const active = Object.values(keys).filter(k => !k.hwid && !k.banned && k.active).length;
        const redeemed = Object.values(keys).filter(k => k.hwid && !k.banned && k.active).length;
        const banned = Object.values(keys).filter(k => k.banned).length;

        document.getElementById('totalKeys').textContent = total;
        document.getElementById('activeKeys').textContent = active;
        document.getElementById('redeemedKeys').textContent = redeemed;

        // Update table
        const tbody = document.getElementById('keysTable');
        if (total === 0) {
            tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; padding: 40px; color: rgba(255,255,255,0.5);">No keys generated yet. Click "Generate Key" to create one!</td></tr>';
            return;
        }

        tbody.innerHTML = '';
        Object.entries(keys).reverse().forEach(([key, data]) => {
            const createdDate = new Date(data.createdAt).toLocaleString();
            const redeemedDate = data.redeemedAt ? new Date(data.redeemedAt).toLocaleString() : '-';
            const discordUser = data.discordUsername || (data.discordId ? `User#${data.discordId.substring(0, 4)}` : '-');
            const robloxUser = data.robloxUsername || (data.robloxId ? `ID: ${data.robloxId}` : '-');
            const username = discordUser !== '-' ? discordUser : robloxUser;
            
            const row = document.createElement('tr');
            
            let statusHTML = '';
            if (data.banned) {
                statusHTML = '<span class="status-badge" style="background: rgba(255, 100, 100, 0.2); color: #ff6464; border: 1px solid #ff6464;">🔴 Banned</span>';
            } else if (data.hwid) {
                statusHTML = '<span class="status-badge status-redeemed">🔒 Redeemed</span>';
            } else {
                statusHTML = '<span class="status-badge status-available">🟢 Available</span>';
            }
            
            let actionsHTML = '';
            if (data.banned) {
                actionsHTML = `
                    <button class="action-btn" onclick="unbanKey('${key}')" style="background: rgba(100, 255, 100, 0.2); color: #64ff64; border: 1px solid #64ff64;">Unban</button>
                    <button class="action-btn" onclick="deleteKey('${key}')">🗑️ Delete</button>
                `;
            } else {
                actionsHTML = `
                    <button class="action-btn" onclick="banKey('${key}')">Ban</button>
                    ${data.hwid ? `<button class="action-btn" onclick="resetKeyHWID('${key}')" style="background: rgba(255, 200, 0, 0.2); color: #ffc800; border: 1px solid #ffc800;">Reset HWID</button>` : ''}
                    <button class="action-btn" onclick="deleteKey('${key}')">🗑️ Delete</button>
                `;
            }
            
            row.innerHTML = `
                <td><code style="color: #a78bfa; font-size: 13px;">${key}</code></td>
                <td>${statusHTML}</td>
                <td><code style="font-size: 11px; color: rgba(255,255,255,0.6);">${data.hwid ? data.hwid.substring(0, 16) + '...' : '-'}</code></td>
                <td style="color: rgba(255,255,255,0.8);">${username}</td>
                <td style="font-size: 12px; color: rgba(255,255,255,0.6);">${createdDate}</td>
                <td style="font-size: 12px; color: rgba(255,255,255,0.6);">${redeemedDate}</td>
                <td style="display: flex; gap: 5px;">${actionsHTML}</td>
            `;
            tbody.appendChild(row);
        });
    }

    function showNotification(message, type = 'info') {
        // Create notification element
        const notification = document.createElement('div');
        notification.style.cssText = `
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 20px;
            border-radius: 8px;
            color: white;
            font-weight: 500;
            z-index: 1000;
            animation: slideIn 0.3s ease-out;
            max-width: 300px;
        `;
        
        if (type === 'success') {
            notification.style.background = 'rgba(0, 255, 100, 0.2)';
            notification.style.border = '1px solid #00ff88';
        } else if (type === 'error') {
            notification.style.background = 'rgba(255, 100, 100, 0.2)';
            notification.style.border = '1px solid #ff6464';
        } else if (type === 'warning') {
            notification.style.background = 'rgba(255, 200, 0, 0.2)';
            notification.style.border = '1px solid #ffc800';
        } else {
            notification.style.background = 'rgba(100, 150, 255, 0.2)';
            notification.style.border = '1px solid #6496ff';
        }
        
        notification.textContent = message;
        document.body.appendChild(notification);
        
        // Remove after 3 seconds
        setTimeout(() => {
            notification.style.animation = 'slideIn 0.3s ease-out reverse';
            setTimeout(() => notification.remove(), 300);
        }, 3000);
    }

    // Auto-refresh keys every 5 seconds
    setInterval(loadKeys, 5000);
    
    // Initial load
    loadKeys();
    updateConnectionStatus(false);
</script>
