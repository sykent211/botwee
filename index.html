<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Key System - Admin Panel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 48px;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            padding: 25px;
        }

        .stat-card h3 {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 10px;
        }

        .stat-card .number {
            font-size: 36px;
            font-weight: bold;
        }

        .green { color: #00ff88; }
        .blue { color: #6496ff; }
        .purple { color: #a78bfa; }

        .generate-section {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
        }

        .generate-section h2 {
            margin-bottom: 20px;
            font-size: 28px;
        }

        .btn {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn:hover {
            transform: scale(1.05);
        }

        .key-display {
            margin-top: 20px;
            background: rgba(0, 255, 100, 0.1);
            border: 2px solid rgba(0, 255, 100, 0.5);
            padding: 20px;
            border-radius: 10px;
            display: none;
        }

        .key-display.show {
            display: block;
        }

        .key-code {
            font-family: 'Courier New', monospace;
            font-size: 24px;
            color: #00ff88;
            margin: 10px 0;
        }

        .copy-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            color: white;
            margin-left: 10px;
        }

        .keys-table {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .status-badge {
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .status-available {
            background: rgba(0, 255, 100, 0.2);
            color: #00ff88;
        }

        .status-redeemed {
            background: rgba(100, 150, 255, 0.2);
            color: #6496ff;
        }

        .action-btn {
            padding: 5px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            margin: 0 2px;
            border: none;
            color: white;
            background: rgba(255, 100, 100, 0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔐 Key System - Admin Panel</h1>
            <p>Generate and manage keys</p>
        </div>

        <div class="stats">
            <div class="stat-card">
                <h3>Total Keys</h3>
                <div class="number purple" id="totalKeys">0</div>
            </div>
            <div class="stat-card">
                <h3>Active Keys</h3>
                <div class="number green" id="activeKeys">0</div>
            </div>
            <div class="stat-card">
                <h3>Redeemed Keys</h3>
                <div class="number blue" id="redeemedKeys">0</div>
            </div>
        </div>

        <div class="generate-section">
            <h2>🔑 Generate New Key</h2>
            <button class="btn" onclick="generateKey()">Generate Key</button>
            
            <div class="key-display" id="keyDisplay">
                <p style="color: #00ff88; font-weight: bold;">✨ Key Generated!</p>
                <div class="key-code">
                    <span id="generatedKey"></span>
                    <button class="copy-btn" onclick="copyKey()">Copy</button>
                </div>
            </div>
        </div>

        <div class="keys-table">
            <h2>📊 All Keys</h2>
            <table>
                <thead>
                    <tr>
                        <th>Key</th>
                        <th>Status</th>
                        <th>HWID</th>
                        <th>Roblox User</th>
                        <th>Created</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="keysTable">
                    <tr>
                        <td colspan="6" style="text-align: center; padding: 40px;">
                            No keys yet. Generate one!
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Load keys from storage
        async function loadKeys() {
            try {
                const result = await window.storage.get('all_keys');
                return result ? JSON.parse(result.value) : {};
            } catch {
                return {};
            }
        }

        // Save keys to storage
        async function saveKeys(keys) {
            await window.storage.set('all_keys', JSON.stringify(keys));
        }

        // Generate random key
        function generateKeyString() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            const segments = [];
            for (let i = 0; i < 4; i++) {
                let segment = '';
                for (let j = 0; j < 4; j++) {
                    segment += chars[Math.floor(Math.random() * chars.length)];
                }
                segments.push(segment);
            }
            return segments.join('-');
        }

        // Generate new key
        async function generateKey() {
            const keys = await loadKeys();
            const key = generateKeyString();
            
            keys[key] = {
                hwid: null,
                robloxUsername: null,
                robloxId: null,
                createdAt: Date.now(),
                redeemedAt: null
            };

            await saveKeys(keys);
            document.getElementById('generatedKey').textContent = key;
            document.getElementById('keyDisplay').classList.add('show');
            displayKeys();
        }

        // Copy key
        function copyKey() {
            const key = document.getElementById('generatedKey').textContent;
            navigator.clipboard.writeText(key);
            alert('Key copied!');
        }

        // Delete key
        async function deleteKey(key) {
            if (!confirm('Delete this key?')) return;
            const keys = await loadKeys();
            delete keys[key];
            await saveKeys(keys);
            displayKeys();
        }

        // Display keys in table
        async function displayKeys() {
            const keys = await loadKeys();
            const total = Object.keys(keys).length;
            const active = Object.values(keys).filter(k => !k.hwid).length;
            const redeemed = Object.values(keys).filter(k => k.hwid).length;

            document.getElementById('totalKeys').textContent = total;
            document.getElementById('activeKeys').textContent = active;
            document.getElementById('redeemedKeys').textContent = redeemed;

            const tbody = document.getElementById('keysTable');
            if (total === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; padding: 40px;">No keys yet. Generate one!</td></tr>';
                return;
            }

            tbody.innerHTML = '';
            Object.entries(keys).reverse().forEach(([key, data]) => {
                const row = document.createElement('tr');
                const statusBadge = data.hwid 
                    ? '<span class="status-badge status-redeemed">🔒 Redeemed</span>'
                    : '<span class="status-badge status-available">🟢 Available</span>';

                row.innerHTML = `
                    <td><code>${key}</code></td>
                    <td>${statusBadge}</td>
                    <td><code style="font-size: 11px;">${data.hwid ? data.hwid.substring(0, 16) + '...' : '-'}</code></td>
                    <td>${data.robloxUsername || '-'}</td>
                    <td>${new Date(data.createdAt).toLocaleDateString()}</td>
                    <td><button class="action-btn" onclick="deleteKey('${key}')">Delete</button></td>
                `;
                tbody.appendChild(row);
            });
        }

        // Initial load
        displayKeys();
    </script>
</body>
</html>
